services:
  # --- BAGIAN 1: HDFS (dari BDE2020, karena terbukti stabil) ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

  # --- BAGIAN 2: SPARK CLUSTER (v3.3.0) ---
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    ports:
      - "8081:8080" # Tetap 8081
      - "7077:7077"
    environment:
      - SPARK_LOCAL_IP=spark-master 

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077

  # --- BAGIAN 3: JUPYTER CLIENT (v3.3.0) ---
  jupyterlab:
    # Ini adalah TAG yang BENAR untuk Spark v3.3.0
    image: jupyter/pyspark-notebook:spark-3.3.0
    container_name: jupyter_client
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
    depends_on:
      - namenode
      - spark-master
    environment:
      # Beri tahu container-nya di mana Spark Masternya
      - SPARK_MASTER=spark://spark-master:7077

volumes:
  hadoop_namenode:
  hadoop_datanode: